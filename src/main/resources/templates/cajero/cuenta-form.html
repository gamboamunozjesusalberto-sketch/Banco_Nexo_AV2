<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Abrir cuenta')}"></head>
<body>
<nav th:replace="~{fragments :: menu}"></nav>
<div th:replace="~{fragments :: mensajes}"></div>
<main class="container py-4">
<div class="mx-auto" style="max-width: 560px;">
<h2 class="mb-3">Abrir cuenta</h2>
<div class="alert alert-warning" th:if="${#lists.isEmpty(clientes)}">Primero debes <a th:href="@{/cajero/clientes/nuevo}">registrar un cliente</a>.</div>
<div class="card"><div class="card-body p-4">
<form th:action="@{/cajero/cuentas}" method="post">
    <div class="mb-3"><label class="form-label">Cliente</label>
        <select name="clienteId" class="form-select" required>
            <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nombre} + ' (DNI ' + ${c.dni} + ')'"></option>
        </select></div>
    <div class="mb-3"><label class="form-label">Tipo de cuenta</label>
        <div class="row g-2">
            <div class="col-6" th:each="t, it : ${tipos}">
                <input type="radio" class="btn-check" name="tipo" th:id="'tipo' + ${it.index}" th:value="${t}" th:checked="${it.first}">
                <label class="btn btn-outline-primary w-100" th:for="'tipo' + ${it.index}" th:text="${t}"></label>
            </div>
        </div>
        <div class="form-text">Ahorros: sin sobregiro. Corriente: sobregiro de hasta S/ 500.</div></div>
    <div class="mb-3"><label class="form-label">Deposito inicial</label>
        <div class="input-group"><span class="input-group-text">S/</span>
            <input type="number" name="depositoInicial" class="form-control" min="0" step="0.01" value="0"></div></div>
    <button type="submit" class="btn btn-primary">Abrir cuenta</button>
    <a class="btn btn-light" th:href="@{/cajero/cuentas}">Cancelar</a>
</form>
</div></div>
</div>
</main>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
