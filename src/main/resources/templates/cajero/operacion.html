<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Deposito o retiro')}"></head>
<body>
<nav th:replace="~{fragments :: menu}"></nav>
<div th:replace="~{fragments :: mensajes}"></div>
<main class="container py-4">
<div class="mx-auto" style="max-width: 560px;">
<h2 class="mb-1">Deposito o retiro</h2>
<p class="text-muted">La operacion se ejecuta como un <strong>comando</strong>: queda en el historial y se puede extornar si hubo un error.</p>
<div class="alert alert-warning" th:if="${#lists.isEmpty(cuentas)}">No hay cuentas. <a th:href="@{/cajero/cuentas/nueva}">Abre una cuenta</a> primero.</div>
<div class="card"><div class="card-body p-4">
<form th:action="@{/cajero/operaciones}" method="post" data-confirmar>
    <div class="mb-3"><label class="form-label">Operacion</label>
        <div class="row g-2">
            <div class="col-6"><input class="btn-check" type="radio" name="tipo" id="dep" value="DEPOSITO" checked>
                <label class="btn btn-outline-primary w-100" for="dep"><svg class="ico"><use th:href="@{/img/iconos.svg#descargar}"></use></svg> Deposito</label></div>
            <div class="col-6"><input class="btn-check" type="radio" name="tipo" id="ret" value="RETIRO">
                <label class="btn btn-outline-primary w-100" for="ret"><svg class="ico"><use th:href="@{/img/iconos.svg#subir}"></use></svg> Retiro</label></div>
        </div></div>
    <div class="mb-3"><label class="form-label">Cuenta</label>
        <select name="cuentaId" class="form-select" data-resumen="Cuenta" required>
            <option th:each="c : ${cuentas}" th:value="${c.id}"
                    th:text="${c.numero} + ' - ' + ${c.clienteNombre} + ' (S/ ' + ${#numbers.formatDecimal(c.saldo, 1, 'COMMA', 2, 'POINT')} + ')'"></option>
        </select></div>
    <div class="mb-3"><label class="form-label">Monto</label>
        <div class="input-group input-group-lg"><span class="input-group-text">S/</span>
            <input type="number" name="monto" class="form-control" min="0.01" step="0.01" data-resumen="Monto" required></div></div>
    <div class="mb-3"><label class="form-label">Descripcion (opcional)</label>
        <input type="text" name="descripcion" class="form-control" maxlength="100" data-resumen="Descripcion"></div>
    <button type="submit" class="btn btn-primary w-100">Ejecutar y emitir comprobante</button>
</form>
</div></div>
</div>
</main>
<div th:replace="~{fragments :: modalConfirmar}"></div>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
