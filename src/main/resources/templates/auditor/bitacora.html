<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Bitacora')}"></head>
<body>
<nav th:replace="~{fragments :: menu}"></nav>
<div th:replace="~{fragments :: mensajes}"></div>
<main class="container py-4">
<div class="d-flex justify-content-between align-items-end flex-wrap gap-2 mb-3">
    <div><h2 class="mb-0">Bitacora de accesos</h2><p class="text-muted mb-0">Ingresos, salidas, intentos fallidos, bloqueos y exportaciones (ultimos 200).</p></div>
    <div class="d-flex gap-2">
        <input type="search" class="form-control form-control-sm" placeholder="Buscar usuario o evento..." data-filtrar="#tablaBit">
        <div class="btn-group">
            <a class="btn btn-outline-primary btn-sm" th:href="@{/auditor/exportar(tipo='BITACORA',formato='csv')}">CSV</a>
            <a class="btn btn-outline-primary btn-sm" th:href="@{/auditor/exportar(tipo='BITACORA',formato='pdf')}">PDF</a>
        </div>
    </div>
</div>
<div class="tabla-nexo"><div class="table-responsive">
<table class="table table-sm align-middle" id="tablaBit">
    <thead><tr><th>Fecha</th><th>Usuario</th><th>Evento</th><th>Detalle</th></tr></thead>
    <tbody>
    <tr th:each="r : ${registros}">
        <td class="small text-nowrap" th:text="${#temporals.format(r.fecha, 'dd/MM/yyyy HH:mm:ss')}"></td>
        <td class="fw-semibold" th:text="${r.username}"></td>
        <td><span class="badge" th:classappend="${#strings.contains(r.evento, 'FALLO') or #strings.contains(r.evento, 'BLOQUEADO') or #strings.contains(r.evento, 'DENEGADO')} ? 'egreso' : 'ingreso'" th:text="${r.evento}"></span></td>
        <td class="small" th:text="${r.detalle}"></td>
    </tr>
    <tr th:if="${#lists.isEmpty(registros)}"><td colspan="4" class="text-center text-muted py-4">Sin registros</td></tr>
    </tbody>
</table>
</div></div>
</main>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
