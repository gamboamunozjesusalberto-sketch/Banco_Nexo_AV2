<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Pagar servicios')}"></head>
<body>
<nav th:replace="~{fragments :: menu}"></nav>
<div th:replace="~{fragments :: mensajes}"></div>
<main class="container py-4">
<div class="mx-auto" style="max-width: 560px;">
<h2 class="mb-1">Pagar servicios</h2>
<p class="text-muted">Luz, agua, internet, telefonia y gas. Necesitas el codigo de suministro de tu recibo.</p>
<div class="alert alert-warning" th:if="${#lists.isEmpty(cuentas)}">No tienes cuentas para pagar.</div>
<div class="card"><div class="card-body p-4">
<form th:action="@{/cliente/pagos}" method="post" data-confirmar th:attr="data-umbral=${umbral}">
    <div class="mb-3"><label class="form-label">Servicio</label>
        <div class="row g-2">
            <div class="col-4 col-md" th:each="s, it : ${servicios}">
                <input type="radio" class="btn-check" name="servicio" th:id="'srv' + ${it.index}" th:value="${s}" th:checked="${it.first}" data-resumen="Servicio">
                <label class="btn btn-outline-primary w-100 small" th:for="'srv' + ${it.index}" th:text="${s}"></label>
            </div>
        </div></div>
    <div class="mb-3"><label class="form-label">Codigo de suministro</label>
        <input type="text" name="referencia" class="form-control" maxlength="12" pattern="[0-9]{6,12}" inputmode="numeric"
               title="De 6 a 12 digitos" data-resumen="Suministro" required>
        <div class="form-text">De 6 a 12 digitos, tal como figura en tu recibo.</div></div>
    <div class="mb-3"><label class="form-label">Pagar desde</label>
        <select name="cuentaId" class="form-select" data-resumen="Desde" required>
            <option th:each="c : ${cuentas}" th:value="${c.id}"
                    th:text="${c.numero} + ' - S/ ' + ${#numbers.formatDecimal(c.saldo, 1, 'COMMA', 2, 'POINT')}"></option>
        </select></div>
    <div class="mb-3"><label class="form-label">Monto</label>
        <div class="input-group input-group-lg"><span class="input-group-text">S/</span>
            <input type="number" name="monto" class="form-control" min="0.01" step="0.01" data-resumen="Monto" required></div></div>
    <div class="bloque-confirmacion d-none mb-3">
        <div class="aviso-seguridad mb-2"><svg class="ico"><use th:href="@{/img/iconos.svg#candado}"></use></svg> <strong>Monto alto.</strong> Desde
            <span th:replace="~{fragments :: dinero(${umbral})}"></span> te pedimos tu clave para confirmar que eres tu.</div>
        <input type="password" name="claveConfirmacion" class="form-control" placeholder="Escribe tu clave" autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-primary btn-lg w-100">Continuar</button>
</form>
</div></div>
</div>
</main>
<div th:replace="~{fragments :: modalConfirmar}"></div>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
