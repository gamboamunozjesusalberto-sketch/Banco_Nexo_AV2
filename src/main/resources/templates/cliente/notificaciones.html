<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Notificaciones')}"></head>
<body>
<nav th:replace="~{fragments :: menu}"></nav>
<div th:replace="~{fragments :: mensajes}"></div>
<main class="container py-4">
<div class="mx-auto" style="max-width: 720px;">
<h2 class="mb-1">Notificaciones</h2>
<p class="text-muted">Te avisamos al instante cuando recibes una transferencia o cambia el estado de tu credito.</p>
<div class="card"><div class="list-group list-group-flush">
    <div class="list-group-item py-3" th:each="n : ${lista}">
        <div class="d-flex justify-content-between align-items-start">
            <div>
                <span class="badge bg-success me-1" th:unless="${n.leida}">Nuevo</span>
                <strong th:text="${n.titulo}"></strong>
            </div>
            <small class="text-muted text-nowrap ms-2" th:text="${#temporals.format(n.fecha, 'dd/MM/yyyy HH:mm')}"></small>
        </div>
        <div class="text-muted mt-1" th:text="${n.mensaje}"></div>
    </div>
    <div class="list-group-item text-center text-muted py-4" th:if="${#lists.isEmpty(lista)}">Todavia no tienes notificaciones.</div>
</div></div>
</div>
</main>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
