<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Clientes')}"></head>
<body>
<nav th:replace="~{fragments :: menu}"></nav>
<div th:replace="~{fragments :: mensajes}"></div>
<main class="container py-4">
<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <h2 class="mb-0">Clientes</h2>
    <input type="search" class="form-control" style="max-width:260px" placeholder="Buscar por nombre o DNI..." data-filtrar="#tablaCli">
</div>
<div class="tabla-nexo"><div class="table-responsive">
<table class="table align-middle" id="tablaCli">
    <thead><tr><th>Nombre</th><th>DNI</th><th>Correo</th><th></th></tr></thead>
    <tbody>
    <tr th:each="c : ${clientes}">
        <td class="fw-semibold" th:text="${c.nombre}"></td><td th:text="${c.dni}"></td><td th:text="${c.correo}"></td>
        <td class="text-end"><a class="btn btn-sm btn-outline-primary" th:href="@{/asesor/clientes/{id}(id=${c.id})}">Ver historial</a></td>
    </tr>
    <tr th:if="${#lists.isEmpty(clientes)}"><td colspan="4" class="text-center text-muted py-4">No hay clientes</td></tr>
    </tbody>
</table>
</div></div>
</main>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
